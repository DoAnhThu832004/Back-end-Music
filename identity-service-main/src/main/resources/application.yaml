server:
  port: 8080
  servlet:
    context-path: /identity

spring:
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/identity_service}
    driverClassName: "com.mysql.cj.jdbc.Driver"
    password: ${DBMS_PASSWORD:root}
    username: ${DBMS_USERNAME:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 20MB        # Tối đa 1 file
      max-request-size: 40MB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dfgwogria}
  api-key: ${CLOUDINARY_API_KEY:715615316369621}
  api-secret: ${CLOUDINARY_API_SECRET:XwZD7_v2VXHlBFmwMzWAZMlUHqE}

jwt:
  signerKey: ${JWT_SIGNER_KEY:1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij}
  valid-duration: 3600 # in seconds, hiệu lực của jwt
  refreshable-duration: 36000 # in seconds, khoảng thời gian cho phép refresh

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  base-url: https://generativelanguage.googleapis.com/v1beta
  connect-timeout-ms: 5000
  read-timeout-ms: 15000

ai:
  router:
    fast-path-enabled: ${AI_FAST_PATH_ENABLED:true}
    reasoning-tier-enabled: ${AI_REASONING_TIER_ENABLED:true}
    fast-tier-model: ${GEMINI_FAST_MODEL:${gemini.model:gemini-3.5-flash-lite}}
    reasoning-tier-model: ${GEMINI_REASONING_MODEL:gemini-2.5-pro}
    first-token-timeout-ms: 8000

resilience4j:
  circuitbreaker:
    instances:
      geminiCriticRouter:
        sliding-window-type: TIME_BASED
        sliding-window-size: 120
        minimum-number-of-calls: 4
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.devteria.identityservice.exception.FirstTokenTimeoutException
        ignore-exceptions:
          - org.apache.catalina.connector.ClientAbortException
          - org.springframework.web.context.request.async.AsyncRequestNotUsableException

